<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conserbrag - Conserto de Eletrodomésticos</title>
  <style>
    /* Estilos permanecem os mesmos do código anterior */
    /* Inclua aqui todo o seu <style> sem alterações, como já estava */
  </style>
</head>
<body>

<!-- HEADER, NAV, SECTIONS... -->
<!-- Todo o conteúdo HTML permanece igual ao que você já tem -->

<!-- Botão com logo do WhatsApp -->
<button type="submit">
  <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/whatsapp.svg" alt="WhatsApp" style="width: 20px; margin-right: 8px; filter: invert(1); vertical-align: middle;">
  Enviar pelo WhatsApp
</button>

<!-- Carrossel de Serviços Realizados com indicadores -->
<section id="realizados">
  <h2>Serviços Realizados</h2>
  <p>Abaixo você pode ver alguns dos serviços que realizamos com excelência:</p>
  <div class="carrossel-container" id="carrossel-servicos-container">
    <button class="carrossel-btn left" id="btn-servicos-left">❮</button>
    <div class="carrossel" id="carrossel-servicos">
      <div class="item"><img src="imagens/1.png" alt="Geladeira" /><p>Geladeira</p></div>
      <div class="item"><img src="imagens/2.png" alt="Ar condicionado" /><p>Ar condicionado</p></div>
      <div class="item"><img src="imagens/3.png" alt="Ar condicionado" /><p>Ar condicionado</p></div>
      <div class="item"><img src="imagens/4.png" alt="Refrigeradores" /><p>Refrigeradores</p></div>
      <div class="item"><img src="imagens/5.png" alt="Ar condicionado" /><p>Ar condicionado</p></div>
      <div class="item"><img src="imagens/6.png" alt="Ar condicionado" /><p>Ar condicionado</p></div>
      <div class="item"><img src="imagens/7.png" alt="Ar condicionado" /><p>Ar condicionado</p></div>
      <div class="item"><img src="imagens/8.png" alt="Lavadoras" /><p>Lavadoras</p></div>
      <div class="item"><img src="imagens/9.png" alt="Ar condicionado" /><p>Ar condicionado</p></div>
    </div>
    <button class="carrossel-btn right" id="btn-servicos-right">❯</button>
    <div class="barra-progresso"><div class="progresso" id="progresso-servicos"></div></div>
    <div class="indicadores" id="indicadores-servicos"></div>
  </div>
</section>

<!-- SCRIPTS -->
<script>
  // Scripts de carrossel de serviços (completo conforme enviado anteriormente)
  const carrosselServicos = document.getElementById('carrossel-servicos');
  const btnServLeft = document.getElementById('btn-servicos-left');
  const btnServRight = document.getElementById('btn-servicos-right');
  const progressoServicos = document.getElementById('progresso-servicos');
  const indicadoresServicos = document.getElementById('indicadores-servicos');
  const totalServicos = carrosselServicos.children.length;
  let indiceServicos = 0;
  let autoScrollServicos;

  function criarIndicadoresServicos() {
    for (let i = 0; i < totalServicos; i++) {
      const span = document.createElement('span');
      span.dataset.index = i;
      if (i === 0) span.classList.add('ativo');
      span.addEventListener('click', () => {
        indiceServicos = i;
        atualizarCarrosselServicos();
        reiniciarBarraProgressoServicos();
      });
      indicadoresServicos.appendChild(span);
    }
  }

  function atualizarCarrosselServicos() {
    const larguraItem = carrosselServicos.children[0].offsetWidth + 20;
    carrosselServicos.style.transform = `translateX(-${indiceServicos * larguraItem}px)`;
    [...indicadoresServicos.children].forEach((span, idx) => {
      span.classList.toggle('ativo', idx === indiceServicos);
    });
  }

  function moverCarrosselServico(direcao) {
    indiceServicos += direcao;
    if (indiceServicos < 0) indiceServicos = totalServicos - 1;
    if (indiceServicos >= totalServicos) indiceServicos = 0;
    atualizarCarrosselServicos();
    reiniciarBarraProgressoServicos();
  }

  function iniciarAutoScrollServicos() {
    autoScrollServicos = setInterval(() => moverCarrosselServico(1), 5000);
  }

  function reiniciarBarraProgressoServicos() {
    progressoServicos.style.animation = 'none';
    progressoServicos.offsetHeight;
    progressoServicos.style.animation = null;
  }

  btnServLeft.addEventListener('click', () => {
    clearInterval(autoScrollServicos);
    moverCarrosselServico(-1);
    iniciarAutoScrollServicos();
  });

  btnServRight.addEventListener('click', () => {
    clearInterval(autoScrollServicos);
    moverCarrosselServico(1);
    iniciarAutoScrollServicos();
  });

  const containerServicos = document.getElementById('carrossel-servicos-container');
  let startXServicos = 0;

  containerServicos.addEventListener('touchstart', (e) => {
    startXServicos = e.touches[0].clientX;
    clearInterval(autoScrollServicos);
  }, { passive: true });

  containerServicos.addEventListener('touchend', (e) => {
    const endX = e.changedTouches[0].clientX;
    const delta = endX - startXServicos;
    if (delta > 50) moverCarrosselServico(-1);
    else if (delta < -50) moverCarrosselServico(1);
    iniciarAutoScrollServicos();
  });

  criarIndicadoresServicos();
  iniciarAutoScrollServicos();
</script>

</body>
</html>
