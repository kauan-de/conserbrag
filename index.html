<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conserbrag - Conserto de Eletrodomésticos</title>
  <style>
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: Arial, sans-serif;
      margin: 0; padding: 0;
      background: #f9f9f9;
      color: #333;
    }
    header {
      background: #0073b7;
      color: white;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      text-align: center;
    }
    header .logo {
      width: 140px;
      height: auto;
      border-radius: 50%;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      background: #005f95;
      padding: 10px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover {
      color: #ffd700;
      text-decoration: underline;
      transition: 0.3s;
    }
    section {
      padding: 40px 20px;
      max-width: 1000px;
      margin: auto;
    }
    h2 {
      color: #0073b7;
      margin-bottom: 20px;
    }
    .services {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }
    .service {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }
    .carrossel-container {
      position: relative;
      overflow: hidden;
      max-width: 1000px;
      margin: 30px auto;
    }
    .carrossel {
      display: flex;
      transition: transform 0.4s ease-in-out;
      gap: 20px;
      will-change: transform;
    }
    .carrossel .item {
      flex: 0 0 300px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
      text-align: center;
      padding: 10px;
    }
    .carrossel .item img {
      width: 100%;
      border-radius: 8px;
      object-fit: cover;
      aspect-ratio: 4/3;
      cursor: pointer;
    }
    .carrossel-btn {
      position: absolute;
      top: 40%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.5);
      color: white;
      border: none;
      font-size: 30px;
      cursor: pointer;
      padding: 10px;
      border-radius: 50%;
      z-index: 10;
    }
    .carrossel-btn.left { left: 10px; }
    .carrossel-btn.right { right: 10px; }
    .barra-progresso {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background-color: #ddd;
      overflow: hidden;
      border-radius: 0 0 8px 8px;
    }
    .progresso {
      height: 100%;
      width: 0%;
      background-color: #0073b7;
      animation: progressoAnim 5s linear infinite;
    }
    @keyframes progressoAnim {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    .indicadores {
      text-align: center;
      margin-top: 10px;
    }
    .indicadores span {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin: 0 5px;
      background: #ccc;
      border-radius: 50%;
      cursor: pointer;
    }
    .indicadores span.ativo {
      background: #0073b7;
    }
    footer {
      background: #0073b7;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <!-- Conteúdo do site continua abaixo (header, nav, seções, etc.) -->
</body>
</html>
